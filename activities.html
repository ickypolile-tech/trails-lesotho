
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activities | Lesotho Trails</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { margin: 0; background: #f7f5ef; font-family: Arial, sans-serif; color: #25352c; }
        .navbar, footer { background: #25352c; }
        .navbar-brand, .nav-link { color: white !important; }
        .nav-link:hover { color: #d6b77a !important; }
        .hero { background: #25352c; color: white; text-align: center; padding: 65px 20px; }
        .content { padding: 40px 20px; }
        .activity-card { background: white; padding: 22px; height: 100%; border-radius: 8px; box-shadow: 0 4px 12px #00000015; }
        .activity-card img { width: 100%; height: 190px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; }
        footer { color: white; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">LT | Lesotho Trails</a>
        <button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#menu">☰</button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                <li class="nav-item"><a class="nav-link" href="activities.html">Activities</a></li>
                <li class="nav-item"><a class="nav-link" href="accommodation.html">Stay</a></li>
                <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="booking.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<header class="hero">
    <h1>Things to Do in Lesotho</h1>
    <p>Enjoy outdoor adventure, culture and beautiful scenery.</p>
</header>

<section class="content container">
    <h2 class="text-center mb-4">Choose Your Adventure</h2>
    <div class="row g-4" id="activities"></div>
</section>

<footer>
    <p>© <span id="year"></span> Lesotho Trails</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const activities = [
        {
            name: "Pony Trekking",
            description: "Explore the highlands on horseback with a suitable local guide.",
            image: "pony trekking.jpg"
        },
        {
            name: "Hiking",
            description: "Discover mountain paths, valleys and spectacular scenery.",
            image: "maluti.jpg"
        },
        {
            name: "Photography",
            description: "Capture the beauty of mountains, rivers and traditional buildings.",
            image: "image 1.jpg"
        },
        {
            name: "Scenic Drives",
            description: "Travel through mountain routes and stop at safe viewpoints.",
            image: "pass camp.jpg"
        },
        {
            name: "Nature Exploration",
            description: "Enjoy the natural landscapes and highland environment.",
            image: "image 2.jpg"
        },
        {
            name: "Cultural Visits",
            description: "Discover traditional buildings and learn about Basotho heritage.",
            image: "image 3.jpg"
        },
        {
            name: "Waterfall Visits",
            description: "Experience the impressive scenery around waterfalls.",
            image: "river days.jpg"
        },
        {
            name: "Mountain Sightseeing",
            description: "Enjoy panoramic views of Lesotho's beautiful highlands.",
            image: "mokhotlong.jpg"
        }
    ];

    activities.forEach(activity => {
        document.getElementById("activities").innerHTML += `
            <div class="col-md-4">
                <div class="activity-card">
                    <img src="${activity.image}" alt="${activity.name}">
                    <h4>${activity.name}</h4>
                    <p>${activity.description}</p>
                    <a href="destinations.html" class="btn btn-outline-success">Explore Places</a>
                </div>
            </div>`;
    });

    document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
