
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations | Lesotho Trails</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { margin: 0; background: #f7f5ef; font-family: Arial, sans-serif; color: #25352c; }
        .navbar, footer { background: #25352c; }
        .navbar-brand, .nav-link { color: white !important; }
        .nav-link:hover { color: #d6b77a !important; }
        .hero { background: #25352c; color: white; text-align: center; padding: 65px 20px; }
        .content { padding: 40px 20px; }
        .card { border: none; height: 100%; box-shadow: 0 4px 12px #00000015; overflow: hidden; }
        .card img { width: 100%; height: 210px; object-fit: cover; }
        footer { color: white; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">LT | Lesotho Trails</a>
        <button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#menu">☰</button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                <li class="nav-item"><a class="nav-link" href="activities.html">Activities</a></li>
                <li class="nav-item"><a class="nav-link" href="accommodation.html">Stay</a></li>
                <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="booking.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<header class="hero">
    <h1>Explore Lesotho</h1>
    <p>Discover remarkable places throughout the Mountain Kingdom.</p>
</header>

<section class="content container">
    <h2 class="text-center mb-4">Tourist Attractions</h2>
    <div class="row g-4" id="destinations"></div>
</section>

<footer>
    <p>© <span id="year"></span> Lesotho Trails</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const places = [
        {name: "Maletsunyane Falls", description: "A famous waterfall near Semonkong.", image: "river days.jpg"},
        {name: "Katse Dam", description: "A major reservoir surrounded by highland scenery.", image: "image 1.jpg"},
        {name: "Thaba-Bosiu", description: "A historic mountain associated with King Moshoeshoe I.", image: "maluti.jpg"},
        {name: "Ts'ehlanyane National Park", description: "A protected area with mountain landscapes and walking trails.", image: "image 2.jpg"},
        {name: "Sehlabathebe National Park", description: "A remote highland area known for its natural scenery.", image: "image 4.JPG"},
        {name: "Sani Pass", description: "A dramatic mountain pass with winding roads.", image: "pass camp.jpg"},
        {name: "Bokong Nature Reserve", description: "A highland reserve with mountain views.", image: "mokhotlong.jpg"},
        {name: "Kome Cave Houses", description: "Traditional cave dwellings with cultural significance.", image: "image 3.jpg"},
        {name: "Morija", description: "A historic settlement with important cultural heritage.", image: "image 5.jpg"},
        {name: "Mohale Dam", description: "A reservoir set among the mountains.", image: "image 6.jpg"},
        {name: "Maseru", description: "The capital city and a centre for shopping and culture.", image: "image.jpg"},
        {name: "Highland Lodges", description: "Explore traditional-style accommodation in mountain settings.", image: "image 7.jpg"}
    ];

    const container = document.getElementById("destinations");

    places.forEach(place => {
        container.innerHTML += `
            <div class="col-md-4">
                <div class="card">
                    <img src="${place.image}" alt="${place.name}">
                    <div class="card-body">
                        <h5>${place.name}</h5>
                        <p>${place.description}</p>
                        <a href="booking.html" class="btn btn-success">Plan a Visit</a>
                    </div>
                </div>
            </div>`;
    });

    document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
