
<!DOCTYPE html>
<head>
    <title>Contact | Lesotho Trails</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { margin: 0; background: #f7f5ef; font-family: Arial, sans-serif; color: #25352c; }
        .navbar, footer { background: #25352c; }
        .navbar-brand, .nav-link { color: white !important; }
        .nav-link:hover { color: #d6b77a !important; }
        .hero { background: #25352c; color: white; text-align: center; padding: 65px 20px; }
        .content { padding: 40px 20px; max-width: 850px; margin: auto; }
        form { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 12px #00000015; }
        label { font-weight: bold; margin-top: 12px; }
        footer { color: white; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">LT | Lesotho Trails</a>
        <button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#menu">☰</button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                <li class="nav-item"><a class="nav-link" href="activities.html">Activities</a></li>
                <li class="nav-item"><a class="nav-link" href="accommodation.html">Stay</a></li>
                <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="booking.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<header class="hero">
    <h1>Contact Us</h1>
    <p>Start planning your journey through Lesotho.</p>
</header>

<section class="content">
    <h2>Trip Enquiry Form</h2>
    <p>Complete the form to tell us about the trip you would like to take.</p>

    <form id="bookingForm">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" class="form-control" required>

        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" required>

        <label for="destination" class="form-label">Preferred Destination</label>
        <select id="destination" class="form-select" required>
            <option value="">Choose a destination</option>
            <option>Maletsunyane Falls</option>
            <option>Katse Dam</option>
            <option>Thaba-Bosiu</option>
            <option>Ts'ehlanyane National Park</option>
            <option>Sehlabathebe National Park</option>
            <option>Sani Pass</option>
            <option>Bokong Nature Reserve</option>
            <option>Kome Cave Houses</option>
            <option>Morija</option>
            <option>Mohale Dam</option>
            <option>Maseru</option>
            <option>Other destinations</option>
        </select>

        <label for="date" class="form-label">Preferred Visit Date</label>
        <input type="date" id="date" class="form-control" required>

        <label for="people" class="form-label">Number of Visitors</label>
        <input type="number" id="people" class="form-control" min="1" value="2" required>

        <label for="message" class="form-label">Message</label>
        <textarea id="message" class="form-control" rows="4" placeholder="Tell us about your plans"></textarea>

        <button type="submit" class="btn btn-success mt-3">Submit Enquiry</button>
        <button type="reset" class="btn btn-outline-secondary mt-3">Clear Form</button>
    </form>

    <p id="result" class="mt-3" aria-live="polite"></p>
</section>

<footer>
    <p>© <span id="year"></span> Lesotho Trails</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("year").textContent = new Date().getFullYear();

    document.getElementById("date").min = new Date().toISOString().split("T")[0];

    document.getElementById("bookingForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value;
        const destination = document.getElementById("destination").value;
        const people = document.getElementById("people").value;

        document.getElementById("result").textContent =
            "Thank you, " + name + "! Your enquiry for " + destination +
            " for " + people + " visitor(s) has been checked. This is a demonstration; no real booking was sent.";
    });

    document.getElementById("bookingForm").addEventListener("reset", function() {
        document.getElementById("result").textContent = "";
    });
</script>
</body>
</html>
